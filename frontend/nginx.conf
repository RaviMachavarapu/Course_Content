server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS, re-resolved every 10 s: a restarted api container gets a new
  # IP, and a proxy_pass to a fixed name would keep the old one (502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  # SPA routes (student `/*` and admin `/admin/*`) all resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always revalidated, so a rebuild is picked up without a hard refresh.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite's content-hashed bundles never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API + media proxied to the backend service. uvicorn trusts these headers
  # from this container only (--forwarded-allow-ips in docker-compose.yml).
  # X-Forwarded-For is overwritten, not appended, so a client cannot choose
  # the address the login rate limit is keyed on.
  location /api/ {
    client_max_body_size 16m;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /healthz {
    proxy_pass $api_upstream;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
