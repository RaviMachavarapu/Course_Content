<html><body><div class="app" data-app-data="{&quot;quiz&quot;: [{&quot;question&quot;: &quot;प्रो. पैट्रिक विंस्टन (Patrick Winston) के अनुसार, इंजीनियरिंग और MIT दृष्टिकोण से आर्टिफिशियल इंटेलिजेंस (AI) की पूरी परिभाषा में क्या शामिल है?&quot;, &quot;answerOptions&quot;: [{&quot;text&quot;: &quot;वे एल्गोरिदम जो उन बाधाओं (constraints) द्वारा सक्षम होते हैं जिन्हें प्रतिनिधित्व (representations) उजागर करते हैं और जो सोच, धारणा व क्रिया का मॉडल बनाते हैं।&quot;, &quot;isCorrect&quot;: true, &quot;rationale&quot;: &quot;AI की संपूर्ण परिभाषा में केवल सोच या मॉडल ही शामिल नहीं हैं, बल्कि प्रतिनिधित्व, उनके द्वारा उजागर की गई बाधाएं और निष्पादित होने वाले एल्गोरिदम भी शामिल हैं।&quot;}, {&quot;text&quot;: &quot;केवल मानव मस्तिष्क की सोच (thinking) और तर्क शक्ति का दर्शनशास्त्र के आधार पर अध्ययन करना।&quot;, &quot;isCorrect&quot;: false, &quot;rationale&quot;: &quot;केवल सोच तक सीमित रहना दर्शनशास्त्र की श्रेणी में आता है, जबकि यह एक इंजीनियरिंग और मॉडल-मेकिंग क्लास है।&quot;}, {&quot;text&quot;: &quot;बिना किसी प्रतिनिधित्व (representation) का उपयोग किए केवल जटिल गणितीय और संभाव्य मॉडल बनाना।&quot;, &quot;isCorrect&quot;: false, &quot;rationale&quot;: &quot;मॉडल बनाने और समस्याओं की बाधाओं को समझने के लिए एक सही प्रतिनिधित्व का होना अनिवार्य है।&quot;}, {&quot;text&quot;: &quot;केवल बड़े डेटासेट का उपयोग करके तंत्रिका नेटवर्क (neural networks) को प्रशिक्षित करने की प्रक्रिया।&quot;, &quot;isCorrect&quot;: false, &quot;rationale&quot;: &quot;यह परिभाषा AI को केवल एक तकनीक तक सीमित कर देती है, जबकि व्याख्यान में एल्गोरिदम, प्रतिनिधित्व और बाधाओं के व्यापक ढांचे पर बल दिया गया है।&quot;}], &quot;hint&quot;: &quot;परिभाषा में केवल मॉडल बनाना ही शामिल नहीं है, बल्कि वे प्रक्रियाएं और ढाँचे भी शामिल हैं जो अंततः निष्पादन में मदद करते हैं।&quot;}, {&quot;question&quot;: &quot;व्याख्यान में वर्णित \&quot;रुम्पेलस्टिल्ट्सकिन सिद्धांत\&quot; (Rumpelstiltskin Principle) का मुख्य विचार क्या है?&quot;, &quot;answerOptions&quot;: [{&quot;text&quot;: &quot;जब आप किसी अवधारणा या चीज़ को एक नाम दे देते हैं, तो आपको उस पर शक्ति और नियंत्रण प्राप्त हो जाता है।&quot;, &quot;isCorrect&quot;: true, &quot;rationale&quot;: &quot;यह सिद्धांत बताता है कि किसी विचार या तकनीक को नाम (प्रतीकात्मक लेबल) देने से उस पर चर्चा करने, उसे समझने और याद रखने की क्षमता मिलती है।&quot;}, {&quot;text&quot;: &quot;जटिल समस्याओं को हल करने के लिए हमेशा सबसे कठिन गणितीय तरीकों का उपयोग करना चाहिए।&quot;, &quot;isCorrect&quot;: false, &quot;rationale&quot;: &quot;यह सिद्धांत गणितीय जटिलता के बारे में नहीं है, बल्कि अवधारणाओं को नाम देने की शक्ति से संबंधित है।&quot;}, {&quot;text&quot;: &quot;यदि कोई एल्गोरिदम पहली बार में विफल हो जाता है, तो उसे तुरंत त्याग देना चाहिए।&quot;, &quot;isCorrect&quot;: false, &quot;rationale&quot;: &quot;यह विफलता प्रबंधन के बारे में नहीं है, बल्कि शब्दावली के माध्यम से ज्ञान को व्यवस्थित करने से जुड़ा है।&quot;}, {&quot;text&quot;: &quot;सॉफ़्टवेयर बनाते समय हमेशा दृश्य (visual) कोड का ही उपयोग करना चाहिए।&quot;, &quot;isCorrect&quot;: false, &quot;rationale&quot;: &quot;यह सिद्धांत दृश्य प्रोग्रामिंग के बारे में नहीं, बल्कि प्रतीकात्मक लेबलों के महत्व को रेखांकित करता है।&quot;}], &quot;hint&quot;: &quot;सोचें कि जब आप जूते के फीते के सिरे (aglet) जैसी किसी वस्तु का नाम जान लेते हैं तो क्या बदलाव आता है।&quot;}], &quot;topics&quot;: {&quot;covered&quot;: [&quot;आर्टिफिशियल इंटेलिजेंस की परिभाषा और उद्देश्य&quot;, &quot;प्रतिनिधित्व और बाधाएं (Representations and Constraints)&quot;, &quot;रुम्पेलस्टिल्ट्सकिन सिद्धांत (Rumpelstiltskin Principle)&quot;, &quot;मानव बुद्धि का विकास और भाषाई क्षमता&quot;], &quot;followUp&quot;: [&quot;जेनेरेट एंड टेस्ट विधि (Generate and Test Method)&quot;, &quot;प्रतीकात्मक एकीकरण (Symbolic Integration)&quot;, &quot;नियम-आधारित विशेषज्ञ प्रणाली (Rule-Based Expert Systems)&quot;, &quot;दृष्टि और भाषा का संयोजन (Vision and Language Integration)&quot;]}}"></div></body></html>
