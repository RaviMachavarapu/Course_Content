<html><body><div class="app" data-app-data="{&quot;flashcards&quot;: [{&quot;f&quot;: {&quot;flashcardContentBlock&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;content&quot;: &quot;ఆర్టిఫిషియల్ ఇంటెలిజెన్స్ (AI) యొక్క సమగ్ర నిర్వచనం ఏమిటి?&quot;}]}, &quot;b&quot;: {&quot;flashcardContentBlock&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;content&quot;: &quot;ఆలోచన, గ్రహింపు (perception), మరియు చర్యలను అర్థం చేసుకోవడానికి సహకరించే నమూనాలను (models) తయారు చేయడానికి తోడ్పడే ప్రాతినిధ్యాలు (representations) మరియు ఆల్గారిథమ్‌ల అధ్యయనమే AI.&quot;}]}, &quot;c&quot;: 1}, {&quot;f&quot;: {&quot;flashcardContentBlock&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;content&quot;: &quot;AI నమూనాల తయారీలో &#x27;ప్రాతినిధ్యం&#x27; (Representation) యొక్క ముఖ్య పాత్ర ఏమిటి?&quot;}]}, &quot;b&quot;: {&quot;flashcardContentBlock&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;content&quot;: &quot;సరైన ప్రాతినిధ్యం సమస్యలోని পরিমিতులను (constraints) స్పష్టంగా బయటపెట్టి, దాన్ని సులభంగా పరిష్కరించేలా చేస్తుంది.&quot;}]}, &quot;c&quot;: 2}, {&quot;f&quot;: {&quot;flashcardContentBlock&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;content&quot;: &quot;&#x27;రంపెల్‌స్టిల్ట్‌స్కిన్ సూత్రం&#x27; (Rumpelstiltskin Principle) అంటే ఏమిటి?&quot;}]}, &quot;b&quot;: {&quot;flashcardContentBlock&quot;: [{&quot;type&quot;: &quot;text&quot;, &quot;content&quot;: &quot;ఒక భావనకు లేదా విషయానికి పేరు పెట్టడం (symbolic label ఇవ్వడం) ద్వారా దానిపై ఆలోచనాత్మక లేదా సంభాషణాత్మక నియంత్రణ (power) వస్తుందనే సూత్రం.&quot;}]}, &quot;c&quot;: 3}], &quot;topics&quot;: {&quot;covered&quot;: [&quot;ఆర్టిఫిషియల్ ఇంటెలిజెన్స్ ప్రాథమిక నిర్వచనం మరియు నమూనాలు&quot;, &quot;సమస్య ప్రాతినిధ్యాలు మరియు పరిమితులు (Representations &amp; Constraints)&quot;, &quot;జెనరేట్ అండ్ టెస్ట్ పద్ధతి మరియు రంపెల్‌స్టిల్ట్‌స్కిన్ సూత్రం&quot;, &quot;AI చరిత్ర మరియు వివిధ యుగాలు (History of AI)&quot;, &quot;మానవ పరిణామం, భాష మరియు దృశ్య ఆలోచన&quot;], &quot;followUp&quot;: [&quot;రూల్-బేస్డ్ ఎక్స్‌పర్ట్ సిస్టమ్స్ మరియు మైసిన్&quot;, &quot;స్టేట్ గ్రాఫ్ సెర్చ్ అల్గారిథమ్‌లు&quot;, &quot;నోఅమ్ చోమ్‌స్కీ భాషా విశ్లేషణ మరియు కంప్యూటేషనల్ లింగ్విస్టిక్స్&quot;]}}"></div></body></html>
